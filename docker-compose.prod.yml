
services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      TZ: America/Sao_Paulo
      POSTGRES_USER: fitandfails
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: fitandfails
    volumes:
      - ./db-data:/var/lib/postgresql/data
    ports:
      - '5432:5432'

  backend:
    image: docker.io/elieltondevopsengineer/fit_and_fails-backend:v13
    restart: unless-stopped
    depends_on:
      - db
    environment:
      TZ: America/Sao_Paulo
      PORT: 4000
      WATER_DEFAULT_GOAL: 2000
      FRONTEND_URL: ${FRONTEND_URL}
      JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://fitandfails:${POSTGRES_PASSWORD}@db:5432/fitandfails
    ports:
      - '4000:4000'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  frontend:
    image: docker.io/elieltondevopsengineer/fit_and_fails-frontend:v18
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      TZ: America/Sao_Paulo
      VITE_API_URL: ${VITE_API_URL}
    ports:
      - '80:80'

  notification:
    image: docker.io/elieltondevopsengineer/fit_and_fails-notification:v2
    restart: unless-stopped
    depends_on:
      - db
    environment:
      TZ: America/Sao_Paulo
      DATABASE_URL: postgres://fitandfails:${POSTGRES_PASSWORD}@db:5432/fitandfails
      NOTIFICATION_PORT: 4100
      PUSH_ENABLED: ${PUSH_ENABLED:-true}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY}
    ports:
      - '4100:4100'
