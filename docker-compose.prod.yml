
services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: fitandfails
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: fitandfails
    volumes:
      - ./db-data:/var/lib/postgresql/data
    ports:
      - '5432:5432'

  backend:
    image: docker.io/elieltondevopsengineer/fit-and-fails-backend:v4
    restart: unless-stopped
    depends_on:
      - db
    environment:
      PORT: 4000
      WATER_DEFAULT_GOAL: 2000
      FRONTEND_URL: ${FRONTEND_URL}
      JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://fitandfails:${POSTGRES_PASSWORD}@db:5432/fitandfails
    ports:
      - '4000:4000'

  frontend:
    image: docker.io/elieltondevopsengineer/fit-and-fails-frontend:v6
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_URL: ${VITE_API_URL}
    ports:
      - '80:80'
