version: '3.8'
services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      TZ: America/Sao_Paulo
      POSTGRES_USER: fitandfails
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fitandfails
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - '5432:5432'

  backend:
    build:
      context: ./backend
      target: builder
    depends_on:
      - db
    environment:
      TZ: America/Sao_Paulo
      DATABASE_URL: postgres://fitandfails:postgres@db:5432/fitandfails
      JWT_SECRET: supersecret_jwt
      PORT: '4000'
      WATER_DEFAULT_GOAL: '2000'
      # Allow local frontend origins for CORS during dockerized dev (desktop + LAN)
      FRONTEND_URL: http://localhost:3000,http://127.0.0.1:3000,http://192.168.86.129:3000
    ports:
      - '4000:4000'
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules
    command: npm run dev

  frontend:
    build:
      context: ./frontend
      target: builder
    depends_on:
      - backend
    environment:
      TZ: America/Sao_Paulo
      VITE_API_URL: http://192.168.86.129:4000
    ports:
      - '3000:3000'
    volumes:
      - ./frontend:/usr/src/app
      - /usr/src/app/node_modules
    command: npm run dev -- --host 0.0.0.0 --port 3000

volumes:
  db-data:
