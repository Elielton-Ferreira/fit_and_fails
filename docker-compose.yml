version: '3.8'
services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      TZ: America/Sao_Paulo
      POSTGRES_USER: fitandfails
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fitandfails
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - '5432:5432'

  backend:
    build:
      context: ./backend
      target: builder
    depends_on:
      - db
    environment:
      TZ: America/Sao_Paulo
      DATABASE_URL: postgres://fitandfails:postgres@db:5432/fitandfails
      JWT_SECRET: supersecret_jwt
      PORT: '4000'
      WATER_DEFAULT_GOAL: '2000'
      # Allow local frontend origins for CORS during dockerized dev (desktop + LAN)
      FRONTEND_URL: http://localhost:3000,http://192.168.15.68:3000
    ports:
      - '4000:4000'
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules
      # Used by /api/system/versions to detect running image tags
      - /var/run/docker.sock:/var/run/docker.sock
    command: npm run dev

  notification:
    build:
      context: ./notification
      target: builder
    depends_on:
      - db
    env_file:
      - ./notification/.env.local
    environment:
      TZ: America/Sao_Paulo
      DATABASE_URL: postgres://fitandfails:postgres@db:5432/fitandfails
      NOTIFICATION_PORT: '4100'
      PUSH_ENABLED: 'true'
    ports:
      - '4100:4100'
    volumes:
      - ./notification:/usr/src/app
      - notification_node_modules:/usr/src/app/node_modules
    command: ["node", "--no-warnings", "--trace-uncaught", "--loader", "ts-node/esm", "src/server.ts"]

  frontend:
    build:
      context: ./frontend
      target: builder
    depends_on:
      - backend
    environment:
      TZ: America/Sao_Paulo
      VITE_API_URL: http://192.168.15.68:4000/api
      VITE_NOTIFICATION_URL: http://192.168.15.68:4100
    ports:
      - '3000:3000'
    volumes:
      - ./frontend:/usr/src/app
      - /usr/src/app/node_modules
    command: npm run dev -- --host 0.0.0.0 --port 3000

volumes:
  db-data:
  notification_node_modules:
